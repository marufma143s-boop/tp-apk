# ==============================================================================
# CENTRALIZED TEMPLATE CONFIGURATION (BACKEND AUTOMATION CONTRACT)
# ==============================================================================
# External Python/FastAPI build workers can modify the properties below directly
# in this file OR override them at build time via command-line flags:
#   gradle assembleDebug -PAPP_NAME="My App" -PPACKAGE_NAME="com.company.myapp" ...
#
# All properties below are automatically read by app/build.gradle.kts and
# injected into AndroidManifest.xml, resources, and BuildConfig.
# ==============================================================================

APP_NAME=WebAPK Template
PACKAGE_NAME=com.aistudio.webapktemplate.k9x4qm
VERSION_NAME=1.0.0
VERSION_CODE=1
MIN_SDK=24
TARGET_SDK=36
# Supported values: unspecified, portrait, landscape, sensor, fullSensor, user
ORIENTATION=unspecified
# Supported values: Theme.AppTemplate, Theme.AppTemplate.FullScreen
APPLICATION_THEME=Theme.AppTemplate
# Entry point relative to app/src/main/assets/
WEB_ENTRY_PATH=web/index.html
# Allow external HTTP/HTTPS API calls from inside the WebView
ALLOW_EXTERNAL_NETWORK=true
# Enable chrome://inspect WebView debugging only on debug builds
ENABLE_WEBVIEW_DEBUG=false
# Background hex color used for Splash Screen and default window background
SPLASH_BG_COLOR=#0F172A

# ==============================================================================
# STANDARD ANDROID & GRADLE BUILD PERFORMANCE SETTINGS
# ==============================================================================
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
googleServices.missing.passthrough=true
